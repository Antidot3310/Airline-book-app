name: Build and Test (.NET 10 Solution)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (WPF & Core)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AirlineTicketOffice.sln

      - name: Build Solution (Release)
        run: dotnet build AirlineTicketOffice.sln --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test AirlineTicketOffice.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"
